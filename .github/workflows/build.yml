name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
env:
  SHERPA_ONNX_VERSION: '1.13.8'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Kokoro runs through sherpa-onnx. Its prebuilt Android libraries are fetched here
      # instead of being stored in the repo. The Kotlin side (Tts.kt) is vendored from the same version.
      - name: Cache sherpa-onnx native libs
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: sherpa-libs
          key: sherpa-onnx-android-${{ env.SHERPA_ONNX_VERSION }}
      - name: Download sherpa-onnx native libs
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V=${SHERPA_ONNX_VERSION}
          F=sherpa-onnx-v$V-android.tar.bz2
          curl -fL --retry 5 -o /tmp/$F https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/$F \
            || curl -fL --retry 5 -o /tmp/$F https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/$F
          mkdir -p /tmp/sherpa sherpa-libs
          tar xjf /tmp/$F -C /tmp/sherpa
          cp -v /tmp/sherpa/jniLibs/arm64-v8a/*.so sherpa-libs/
      - name: Add native libs to the app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp -v sherpa-libs/*.so app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Yomiage-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Yomiage-${{ github.run_number }}
          path: Yomiage-${{ github.run_number }}.apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yomiage build ${{ github.run_number }}
          files: Yomiage-${{ github.run_number }}.apk
